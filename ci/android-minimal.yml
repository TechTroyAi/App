name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/lint-kotlin-pitfalls.py
      - name: Build debug APK
        id: build
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E "^e:|error:|FAILURE|Caused by|Unresolved|Execution failed" build.log \
            | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "--- last 60 lines ---"
          tail -60 build.log | while IFS= read -r line; do echo "::error::$line"; done
      - run: python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blockhold-Defense-v1.4.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
