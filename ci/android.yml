# !!! THIS FILE IS INERT WHERE IT SITS !!!
#
# GitHub Actions only reads workflows from .github/workflows/. While this file
# lives in ci/ it never runs, which is why the v1.2 APK shipped without ever
# being built or verified by CI. Activate it with:
#
#     mkdir -p .github/workflows && git mv ci/android.yml .github/workflows/android.yml
#     git commit -m "Activate Android CI" && git push
#
# (An automation token without the `workflows` scope cannot create that path,
# so this has to be done with normal user credentials.)

name: Android APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The Android Gradle Plugin already zipaligns its own output. This step
      # exists because the v1.2 artifacts that shipped from this repo were
      # assembled by hand with apktool and never aligned, which is exactly the
      # class of defect CI is here to stop.
      - name: Verify APK structure
        run: |
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify alignment with zipalign
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using $BT"
          "$BT/zipalign" -c -p -v 4 app/build/outputs/apk/debug/app-debug.apk > /dev/null
          echo "zipalign check passed"
          "$BT/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Record artifact hash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Blockhold-Defense-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
