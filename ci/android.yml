# !!! THIS FILE IS INERT WHERE IT SITS !!!
#
# GitHub Actions only reads workflows from .github/workflows/. While this file
# lives in ci/ it never runs, which is why the v1.2 APK shipped without ever
# being built or verified by CI. Activate it with:
#
#     mkdir -p .github/workflows && git mv ci/android.yml .github/workflows/android.yml
#     git commit -m "Activate Android CI" && git push
#
# (An automation token without the `workflows` scope cannot create that path,
# so this has to be done with normal user credentials.)

name: Android APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint Kotlin runtime pitfalls
        # Catches the class of bug that broke v1.2: Kotlin 1.7 made maxBy/minBy/max()/min()
        # throw on empty collections, which the compiler only reports as warnings.
        run: python3 scripts/lint-kotlin-pitfalls.py

      # Restores the permanent release key from repository secrets, if configured.
      # Without it every build is signed with a throwaway per-runner debug key, which
      # cannot update any previously installed APK (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # Create the key with scripts/make-signing-key.sh, then add:
      #   BLOCKHOLD_KEYSTORE_BASE64, BLOCKHOLD_STORE_PASSWORD, BLOCKHOLD_KEY_ALIAS
      - name: Restore release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKHOLD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOCKHOLD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOCKHOLD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret configured; building debug only."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .signing/blockhold-release.p12
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$STORE_PASSWORD"
          } > .signing/release.properties
          chmod 600 .signing/blockhold-release.p12 .signing/release.properties
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.present == 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK structure
        run: |
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release.apk
          fi

      # The Android Gradle Plugin already zipaligns its own output. This step exists
      # because the v1.2 artifacts that shipped from this repo were assembled by hand
      # with apktool and never aligned, which is the class of defect CI is here to stop.
      - name: Verify alignment and signature
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using $BT"
          for APK in app/build/outputs/apk/debug/app-debug.apk \
                     app/build/outputs/apk/release/app-release.apk; do
            [ -f "$APK" ] || continue
            echo "=== $APK"
            "$BT/zipalign" -c -p -v 4 "$APK" > /dev/null
            echo "zipalign check passed"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
          done

      - name: Record artifact hashes
        run: |
          sha256sum app/build/outputs/apk/*/*.apk | tee apk-sha256.txt

      - name: Remove signing material
        if: always()
        run: rm -rf .signing

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Blockhold-Defense-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
