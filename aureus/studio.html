<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureus Studio</title>
<style>
  :root{
    --bg:#0b0a08; --panel:#141109; --line:#2e2513; --gold:#d4af37;
    --gold-bright:#f0d264; --text:#e8e2d0; --dim:#8a8271; --red:#e05252;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:28px}
  header{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
  header h1{color:var(--gold);font-size:26px;letter-spacing:2px}
  header .sub{color:var(--dim)}
  .recbar{display:flex;align-items:center;gap:18px;margin-bottom:28px}
  #recBtn{
    width:110px;height:110px;border-radius:50%;border:4px solid var(--gold);
    background:radial-gradient(circle at 35% 30%, #1c1710, #0b0a08);
    color:var(--gold-bright);font-size:18px;font-weight:700;letter-spacing:2px;cursor:pointer;
    transition:transform .12s, box-shadow .2s;
  }
  #recBtn:hover{transform:scale(1.04)}
  #recBtn.on{border-color:var(--red);color:var(--red);box-shadow:0 0 26px rgba(224,82,82,.35);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 8px rgba(224,82,82,.2)}}
  #recInfo{font-size:15px}
  #recInfo .t{font-size:24px;color:var(--gold-bright)}
  #recInfo .dim{color:var(--dim)}
  h2{color:var(--gold);font-size:16px;letter-spacing:1px;margin:8px 0 14px}
  #dirNote{color:var(--dim);font-size:13px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card .pv{height:150px;background:#000;display:flex;align-items:center;justify-content:center}
  .card .pv img,.card .pv video{max-width:100%;max-height:150px}
  .card .meta{padding:10px 12px}
  .card .name{font-size:13px;word-break:break-all;color:var(--text)}
  .card .size{color:var(--dim);font-size:12px;margin:2px 0 8px}
  .card .row{display:flex;gap:8px}
  button.act{
    flex:1;background:none;border:1px solid var(--gold);color:var(--gold);
    border-radius:6px;padding:5px 0;cursor:pointer;font-size:12px;letter-spacing:1px;
  }
  button.act:hover{background:rgba(212,175,55,.12)}
  button.del{border-color:var(--red);color:var(--red)}
  button.del:hover{background:rgba(224,82,82,.12)}
  .empty{color:var(--dim);padding:20px 0}
  /* modal */
  #trimModal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
  #trimModal.open{display:flex}
  #trimModal .box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:24px;width:360px}
  #trimModal h3{color:var(--gold);margin-bottom:6px}
  #trimModal .f{color:var(--dim);font-size:12px;word-break:break-all;margin-bottom:14px}
  #trimModal label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
  #trimModal input{width:100%;background:#0b0a08;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px}
  #trimModal .btns{display:flex;gap:10px;margin-top:18px}
  #trimMsg{color:var(--gold-bright);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>◆ AUREUS</h1><span class="sub">studio · made by Troy · <span id="ver"></span></span>
</header>

<div class="recbar">
  <button id="recBtn" onclick="toggleRec()">REC</button>
  <div id="recInfo">
    <div class="t" id="timer">00:00</div>
    <div class="dim" id="frames">idle</div>
    <div class="dim" id="lastErr"></div>
  </div>
</div>

<h2>RECORDINGS</h2>
<div id="dirNote"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">No recordings yet — hit REC.</div>

<div id="trimModal">
  <div class="box">
    <h3>TRIM CLIP</h3>
    <div class="f" id="trimFile"></div>
    <label>Start (seconds)</label><input id="trimStart" value="0">
    <label>End (seconds, blank = to the end)</label><input id="trimEnd" value="">
    <div class="btns">
      <button class="act" onclick="doTrim()">SAVE TRIM</button>
      <button class="act del" onclick="closeTrim()">CANCEL</button>
    </div>
    <div id="trimMsg"></div>
  </div>
</div>

<script>
let state = {recording:false};
let trimTarget = "";

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : undefined);
  return r.json();
}

async function pollStatus(){
  const s = await api("/api/status");
  state = s;
  document.getElementById("ver").textContent = "v"+s.version;
  const btn = document.getElementById("recBtn");
  btn.textContent = s.recording ? "STOP" : "REC";
  btn.classList.toggle("on", s.recording);
  const sec = Math.floor(s.seconds||0);
  document.getElementById("timer").textContent =
      String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  document.getElementById("frames").textContent = s.recording ? (s.frames+" frames") : "idle";
  document.getElementById("lastErr").textContent = s.lastErr || "";
  document.getElementById("dirNote").textContent = "saved to: "+s.recDir;
}

async function loadFiles(){
  const files = await api("/api/files");
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("empty").style.display = files.length ? "none" : "block";
  for (const f of files){
    const card = document.createElement("div"); card.className = "card";
    const pv = f.kind==="gif"
      ? `<img src="/files/${f.name}?t=${Date.now()}">`
      : `<video src="/files/${f.name}" muted loop autoplay></video>`;
    card.innerHTML = `
      <div class="pv">${pv}</div>
      <div class="meta">
        <div class="name">${f.name}</div>
        <div class="size">${human(f.size)}</div>
        <div class="row">
          <button class="act" onclick="openTrim('${f.name}')">TRIM</button>
          <button class="act del" onclick="del('${f.name}')">DEL</button>
        </div>
      </div>`;
    grid.appendChild(card);
  }
}

function human(n){ if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(1)+" KB"; return (n/1048576).toFixed(1)+" MB"; }

async function toggleRec(){
  if (state.recording){ await api("/api/record/stop", {}); }
  else { await api("/api/record/start", {}); }
  pollStatus(); loadFiles();
}

async function del(name){
  if(!confirm("Delete "+name+"?")) return;
  await api("/api/delete", {file:name});
  loadFiles();
}

function openTrim(name){
  trimTarget = name;
  document.getElementById("trimFile").textContent = name;
  document.getElementById("trimStart").value = "0";
  document.getElementById("trimEnd").value = "";
  document.getElementById("trimMsg").textContent = "";
  document.getElementById("trimModal").classList.add("open");
}
function closeTrim(){ document.getElementById("trimModal").classList.remove("open"); }

async function doTrim(){
  const msg = document.getElementById("trimMsg");
  msg.textContent = "trimming…";
  const r = await api("/api/trim", {
    file: trimTarget,
    start: document.getElementById("trimStart").value,
    end: document.getElementById("trimEnd").value,
  });
  if (r.error){ msg.textContent = "✗ "+r.error; return; }
  msg.textContent = "✓ saved "+r.path;
  loadFiles();
}

pollStatus(); loadFiles();
setInterval(pollStatus, 500);
setInterval(loadFiles, 2000);
</script>
</body>
</html>
