name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Artifact names used to be hardcoded to v1.4.0, so every CI upload was
      # labelled with a version the repo never shipped. Read the real stamp from
      # the build file instead and the names track releases automatically.
      - name: Read versionName from app/build.gradle.kts
        id: version
        run: echo "name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - run: python3 scripts/lint-kotlin-pitfalls.py

      # Debug APK — always built for testing
      - run: ./gradlew --no-daemon assembleDebug

      - run: python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jadex-v${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release APK — signed if secrets are configured, unsigned otherwise
      - name: Restore signing key (if available)
        id: signing
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKHOLD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOCKHOLD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOCKHOLD_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            mkdir -p .signing
            echo "$KEYSTORE_BASE64" | base64 -d > .signing/blockhold-release.p12
            cat > .signing/release.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyAlias=${KEY_ALIAS:-blockhold}
          keyPassword=$STORE_PASSWORD
          EOF
            echo "signing_configured=true" >> "$GITHUB_OUTPUT"
            echo "Signing key restored from secrets"
          else
            echo "signing_configured=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured — building unsigned release"
          fi

      - name: Build release APK
        run: |
          if [ "${{ steps.signing.outputs.signing_configured }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleRelease -PskipSigning=true
          fi

      # An APK only updates an existing install if it carries the SAME signing
      # certificate and a HIGHER versionCode. Fail loudly rather than shipping
      # something the device will reject with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      - name: Check update compatibility
        if: steps.signing.outputs.signing_configured == 'true'
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          python3 scripts/check-update-compatible.py "$apk"

      - name: Warn when the release is not update-capable
        if: steps.signing.outputs.signing_configured != 'true'
        run: |
          echo "::warning::No signing secrets configured, so this release APK is unsigned."
          echo "::warning::It cannot update an installed Jadex. Add BLOCKHOLD_KEYSTORE_BASE64,"
          echo "::warning::BLOCKHOLD_STORE_PASSWORD and BLOCKHOLD_KEY_ALIAS to repository secrets."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Jadex-v${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # ClockCanvas is a second, self-contained Gradle project in this repo. Its
  # release build is verified with the repository's *offline* toolchain
  # (aapt2 + kotlinc + dx + apksigner, no Android SDK, no Maven), which is the
  # same path the app was developed with, so CI proves the committed APK is
  # reproducible rather than just that Gradle started.
  clockcanvas:
    name: ClockCanvas (offline toolchain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clockcanvas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CLOCKCANVAS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLOCKCANVAS_STORE_PASSWORD }}
        run: |
          mkdir -p .signing
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > .signing/clockcanvas-release.p12
            printf 'storePassword=%s\nkeyAlias=clockcanvas\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$STORE_PASSWORD" > .signing/release.properties
            chmod 600 .signing/clockcanvas-release.p12 .signing/release.properties
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CLOCKCANVAS_KEYSTORE_BASE64/CLOCKCANVAS_STORE_PASSWORD secrets;" \
                 "this job will mint a throwaway key, so the APK cannot update an installed ClockCanvas."
          fi

      - name: Provision aapt2, kotlinc, android.jar, dx, apksigner
        run: bash tools/setup-offline-toolchain.sh

      - name: Build, sign and verify the release APK
        env:
          CLOCKCANVAS_ALLOW_NEW_KEY: ${{ steps.signing.outputs.configured == 'true' && '' || '1' }}
        run: python3 tools/build-offline-apk.py

      # An APK only updates an installed ClockCanvas if it carries the same signing
      # certificate, so check that against the recorded milestone before uploading.
      - name: Check the signing certificate
        run: python3 tools/verify-release-cert.py artifacts/ClockCanvas-v1.0.0-installable.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClockCanvas-release
          path: clockcanvas/artifacts/*.apk
          if-no-files-found: error
