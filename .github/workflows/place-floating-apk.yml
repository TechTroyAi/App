name: Place Floating Fan APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :floating-app:assembleDebug
      - name: Commit requested debug APK
        run: |
          mkdir -p artifacts
          cp floating-app/build/outputs/apk/debug/floating-app-debug.apk artifacts/Floating-Fan-v1.0.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/Floating-Fan-v1.0.0-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Add Floating Fan debug APK'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
