# Builds ScreenRecorder.exe on a native Windows runner on every change to the
# recorder source, uploads it as a workflow artifact, and commits the fresh
# binary back to artifacts/ so the repo never drifts from source. Attaching
# to GitHub Releases happens when a v* tag is pushed.
name: windows-exe

on:
  push:
    paths:
      - "screen-recorder/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write # push the rebuilt exe back and create releases

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build exe (native Windows runner)
        run: bash screen-recorder/build.sh

      - name: Run unit tests
        run: go test ./...
        working-directory: screen-recorder

      - name: Smoke test the exe
        run: |
          exe=$(ls -t artifacts/ScreenRecorder-*.exe | head -1)
          echo "smoke testing $exe"
          if "$exe" -h 2>&1 | grep -q ScreenRecorder; then
            echo "smoke test OK: $exe prints usage"
          else
            echo "exe did not print usage" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-exe
          path: artifacts/ScreenRecorder-*.exe
          if-no-files-found: error

      - name: Commit rebuilt exe back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ScreenRecorder-*.exe
          if git diff --cached --quiet; then
            echo "exe unchanged; nothing to commit"
          elif [[ "$GITHUB_REF" != refs/heads/* ]]; then
            # A tag push: the release job publishes the exe instead, and there
            # is no branch here to push a commit back to.
            echo "not a branch; keeping the rebuilt exe as a workflow artifact only"
          else
            git commit -m "CI: rebuild ScreenRecorder exe [skip ci]"
            # actions/checkout creates the local branch with `checkout -B`, which
            # sets no upstream, so a bare `git push` fails with "no upstream
            # branch". Name the destination explicitly.
            git push origin "HEAD:$GITHUB_REF"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenRecorder-exe
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ScreenRecorder-*.exe
          generate_release_notes: true
